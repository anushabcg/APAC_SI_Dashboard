function svgEl(tag, attrs){
  const el = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);

}
function makeSvg(container, w, h){
  container.innerHTML = &#x27;&#x27;;
  const svg = svgEl(&#x27;svg&#x27;, {viewBox:`0 0 ${w} ${h}`, width:&#x27;100%&#x27;, height:&#x27;100%&#x27;, preserveAspectRatio:&#x27;xMidYMid meet&#x27;, &#x27;font-family&#x27;:&#x27;&quot;Henderson BCG Sans&quot;, Arial, sans-serif&#x27;});

/* --- interactive hover tooltips (parity with prior Chart.js hovers) --- */
let __chtip=null;

function __ttMove(ev){ const t=__tip(),p=14; let x=ev.clientX+p,y=ev.clientY+p; const w=t.offsetWidth,h=t.offsetHeight; if(x+w&gt;window.innerWidth)x=ev.clientX-w-p; if(y+h&gt;window.innerHeight)y=ev.clientY-h-p; t.style.left=Math.max(4,x)+&#x27;px&#x27;; t.style.top=Math.max(4,y)+&#x27;px&#x27;; }

/* Simple vertical bar chart: one series, value labels, optional bracket annotation */
function bcgBarChart(container, opts){
  const {labels, values, color=BCG.pulse3, maxY, valueFmt=v=&gt;v, bracket} = opts;
  const w = container.clientWidth || 400, h = container.clientHeight || 210;
  const padTop = bracket ? 46 : 20, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const max = maxY || Math.max(...values) * 1.15;
  const n = values.length;
  const gap = 10;
  const barW = (w - padL - padR - gap*(n-1)) / n;
  // gridlines
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  values.forEach((v,i)=&gt;{
    const bh = (v/max)*plotH;
    const x = padL + i*(barW+gap);
    const y = padTop + plotH - bh;
    svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:bh,fill:color,rx:2}));
    const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:BCG.ink});
    t.textContent = valueFmt(v);
    svg.appendChild(t);
    const lbl = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,fill:BCG.muted});
    lbl.textContent = labels[i];
    svg.appendChild(lbl);
  });
  if (bracket){
    const ia = Math.max(0,n-2), ib = n-1;
    const x0 = padL + ia*(barW+gap) + barW/2, x1 = padL + ib*(barW+gap) + barW/2;
    const topVals = [values[ia], values[ib]];
    const yTop = padTop + plotH - (Math.max(...topVals)/max)*plotH - 28;

&lt;script&gt;
/* BCG lightweight inline-SVG chart helpers (no external dependencies) */
const BCG = {
  ink: &#x27;#0C2B15&#x27;, muted: &#x27;#535353&#x27;, line: &#x27;#DFD7CD&#x27;, track: &#x27;#F1EEEA&#x27;,
  pulse2: &#x27;#85DDA8&#x27;, pulse3: &#x27;#21BF61&#x27;, pulse4: &#x27;#099341&#x27;, pulse5: &#x27;#08722E&#x27;,
  tangerine3: &#x27;#EA7B26&#x27;, tangerine4: &#x27;#CC6017&#x27;,
  saffron3: &#x27;#E8AB00&#x27;,
  cat: [&#x27;#21BF61&#x27;,&#x27;#19A8AF&#x27;,&#x27;#454AC1&#x27;,&#x27;#E8AB00&#x27;,&#x27;#00B585&#x27;,&#x27;#EA7B26&#x27;,&#x27;#7A7A7A&#x27;,&#x27;#313E99&#x27;]
};
function svgEl(tag, attrs){
  const el = document.createElementNS(&#x27;http://www.w3.org/2000/svg&#x27;, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  return el;
}
function makeSvg(container, w, h){
  container.innerHTML = &#x27;&#x27;;
  const svg = svgEl(&#x27;svg&#x27;, {viewBox:`0 0 ${w} ${h}`, width:&#x27;100%&#x27;, height:&#x27;100%&#x27;, preserveAspectRatio:&#x27;xMidYMid meet&#x27;, &#x27;font-family&#x27;:&#x27;&quot;Henderson BCG Sans&quot;, Arial, sans-serif&#x27;});
  container.appendChild(svg);
  return svg;
}

/* --- interactive hover tooltips (parity with prior Chart.js hovers) --- */
let __chtip=null;
function __tip(){ if(__chtip) return __chtip; const d=document.createElement(&#x27;div&#x27;); d.className=&#x27;bcg-chart-tip&#x27;; d.style.cssText=&#x27;position:fixed;z-index:99999;display:none;pointer-events:none;background:#0C2B15;color:#FCFBFA;font-family:&quot;Henderson BCG Sans&quot;,Arial,sans-serif;font-size:11px;line-height:1.45;padding:7px 10px;border-radius:6px;box-shadow:0 6px 18px rgba(12,43,21,.28);max-width:260px;&#x27;; document.body.appendChild(d); __chtip=d; return d; }
function __ttMove(ev){ const t=__tip(),p=14; let x=ev.clientX+p,y=ev.clientY+p; const w=t.offsetWidth,h=t.offsetHeight; if(x+w&gt;window.innerWidth)x=ev.clientX-w-p; if(y+h&gt;window.innerHeight)y=ev.clientY-h-p; t.style.left=Math.max(4,x)+&#x27;px&#x27;; t.style.top=Math.max(4,y)+&#x27;px&#x27;; }
function __ttShow(html,ev){ const t=__tip(); t.innerHTML=html; t.style.display=&#x27;block&#x27;; __ttMove(ev); }
function __ttHide(){ if(__chtip)__chtip.style.display=&#x27;none&#x27;; }
function __ttRows(title,rows){ let h=&#x27;&lt;div style=&quot;font-weight:700;margin-bottom:3px&quot;&gt;&#x27;+title+&#x27;&lt;/div&gt;&#x27;; rows.forEach(function(r){ h+=&#x27;&lt;div style=&quot;display:flex;justify-content:space-between;gap:16px&quot;&gt;&lt;span style=&quot;opacity:.85&quot;&gt;&#x27;+r[0]+&#x27;&lt;/span&gt;&lt;span style=&quot;font-weight:700&quot;&gt;&#x27;+r[1]+&#x27;&lt;/span&gt;&lt;/div&gt;&#x27;; }); return h; }
function __attach(el,html){ el.style.cursor=&#x27;default&#x27;; el.addEventListener(&#x27;mouseenter&#x27;,function(ev){__ttShow(html,ev);}); el.addEventListener(&#x27;mousemove&#x27;,__ttMove); el.addEventListener(&#x27;mouseleave&#x27;,__ttHide); }
function __hit(svg,x,y,w,h){ const r=svgEl(&#x27;rect&#x27;,{x:x,y:y,width:Math.max(w,1),height:Math.max(h,1),fill:&#x27;transparent&#x27;}); svg.appendChild(r); return r; }

/* Simple vertical bar chart: one series, value labels, optional bracket annotation */
function bcgBarChart(container, opts){
  const {labels, values, color=BCG.pulse3, maxY, valueFmt=v=&gt;v, bracket} = opts;
  const w = container.clientWidth || 400, h = container.clientHeight || 210;
  const padTop = bracket ? 46 : 20, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const max = maxY || Math.max(...values) * 1.15;
  const n = values.length;
  const gap = 10;
  const barW = (w - padL - padR - gap*(n-1)) / n;
  // gridlines
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  values.forEach((v,i)=&gt;{
    const bh = (v/max)*plotH;
    const x = padL + i*(barW+gap);
    const y = padTop + plotH - bh;
    svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:bh,fill:color,rx:2}));
    const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:BCG.ink});
    t.textContent = valueFmt(v);
    svg.appendChild(t);
    const lbl = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,fill:BCG.muted});
    lbl.textContent = labels[i];
    svg.appendChild(lbl);
  });
  if (bracket){
    const ia = Math.max(0,n-2), ib = n-1;
    const x0 = padL + ia*(barW+gap) + barW/2, x1 = padL + ib*(barW+gap) + barW/2;
    const topVals = [values[ia], values[ib]];
    const yTop = padTop + plotH - (Math.max(...topVals)/max)*plotH - 28;
    const y0 = padTop + plotH - (values[ia]/max)*plotH - 20;
    const y1 = padTop + plotH - (values[n-1]/max)*plotH - 20;
    svg.appendChild(svgEl(&#x27;path&#x27;,{d:`M${x0},${y0} L${x0},${yTop} L${x1},${yTop} L${x1},${y1}`,fill:&#x27;none&#x27;,stroke:BCG.muted,&#x27;stroke-width&#x27;:1.2}));
    const lbl = svgEl(&#x27;text&#x27;,{x:(x0+x1)/2,y:yTop-4,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:(String(bracket).trim().charAt(0)===&#x27;-&#x27;?BCG.tangerine4:BCG.pulse4)});
    lbl.textContent = bracket;
    svg.appendChild(lbl);
  }
  
  values.forEach(function(v,i){
    const hx = padL + i*(barW+gap);
    __attach(__hit(svg, hx, padTop, barW, plotH),
      &#x27;&lt;div style=&quot;font-weight:700&quot;&gt;&#x27;+labels[i]+&#x27;&lt;/div&gt;&lt;div style=&quot;font-size:14px;font-weight:800;margin-top:1px&quot;&gt;$&#x27;+valueFmt(v)+&#x27;M&lt;/div&gt;&#x27;);
  });
  return svg;
}
/* Grouped bar chart: 2+ series side by side per category, with optional per-pair YoY% labels */
function bcgGroupedBarChart(container, opts){
  const {labels, series, maxY, valueFmt=v=&gt;v, yoy} = opts;
  const w = container.clientWidth || 500, h = container.clientHeight || 210;
  const padTop = 28, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const allVals = series.flatMap(s=&gt;s.data);
  const max = maxY || Math.max(...allVals) * 1.2;
  const n = labels.length, s = series.length;
  const groupGap = 14, barGap = 3;
  const groupW = (w - padL - padR - groupGap*(n-1)) / n;
  const barW = (groupW - barGap*(s-1)) / s;
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  labels.forEach((lab,i)=&gt;{
    const gx = padL + i*(groupW+groupGap);
    series.forEach((ser,j)=&gt;{
      const v = ser.data[i];
      const bh = (v/max)*plotH;
      const x = gx + j*(barW+barGap);
      const y = padTop + plotH - bh;
      svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:Math.max(bh,0.5),fill:ser.color,rx:1.5}));
      if (bh &gt; 12){
        const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y+bh/2+3,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:8,&#x27;font-weight&#x27;:600,fill:&#x27;#FCFBFA&#x27;});
        t.textContent = valueFmt(v);
        svg.appendChild(t);
      }
    });
    const lbl = svgEl(&#x27;text&#x27;,{x:gx+groupW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,fill:BCG.muted});
    lbl.textContent = lab;
    svg.appendChild(lbl);
    if (yoy &amp;&amp; yoy[i] !== undefined){
      const topV = Math.max(...series.map(ser=&gt;ser.data[i]));
      const y = padTop + plotH - (topV/max)*plotH - 5;
      const g = yoy[i];
      const t = svgEl(&#x27;text&#x27;,{x:gx+groupW/2,y,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,&#x27;font-weight&#x27;:700,fill:(g&gt;=0?BCG.pulse4:BCG.tangerine4)});
      t.textContent = (g&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+g+&#x27;%&#x27;;
      svg.appendChild(t);
    }
  });
  
  labels.forEach(function(lab,i){

/* Stacked bar chart: multiple series stacked per category, totals + optional YoY bracket on last two bars */
function bcgStackedBarChart(container, opts){

  const w = container.clientWidth || 500, h = container.clientHeight || 260;

  const stackTops = labels.map((_,i)=&gt;series.reduce((s,ser)=&gt;s+Math.max(ser.data[i]||0,0),0));
  const max = maxY || Math.max(...stackTops) * 1.2;
  const n = labels.length;
  const gap = 16;
  const barW = (w - padL - padR - gap*(n-1)) / n;
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  labels.forEach((lab,i)=&gt;{
    const x = padL + i*(barW+gap);
    let yCursor = padTop + plotH;
    series.forEach(ser=&gt;{
      const v = ser.data[i] || 0;
      if (v &lt;= 0) return;
      const bh = (v/max)*plotH;
      const y = yCursor - bh;
      svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:bh,fill:ser.color}));
      if (bh &gt; 11){
        const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y+bh/2+3,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:8,&#x27;font-weight&#x27;:600,fill:&#x27;#FCFBFA&#x27;});
        t.textContent = valueFmt(v);
        svg.appendChild(t);
      }
      yCursor = y;
    });
    const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:yCursor-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,&#x27;font-weight&#x27;:700,fill:BCG.ink});

    const lbl = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,fill:BCG.muted});

    svg.appendChild(lbl);
  });
  if (n &gt;= 2 &amp;&amp; !opts.noBracket){
    const totPrev = totals[n-2], totCurr = totals[n-1];
    const yoy = totPrev ? Math.round((totCurr-totPrev)/totPrev*100) : 0;
    const xPrev = padL + (n-2)*(barW+gap) + barW/2;
    const xCurr = padL + (n-1)*(barW+gap) + barW/2;
    const yPrev = padTop + plotH - (stackTops[n-2]/max)*plotH - 16;
    const yCurr = padTop + plotH - (stackTops[n-1]/max)*plotH;

    const t = svgEl(&#x27;text&#x27;,{x:(xPrev+xCurr)/2,y:yMid-4,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:color});
    t.textContent = (yoy&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+yoy+&#x27;%&#x27;;
    svg.appendChild(t);
  }
  
  labels.forEach(function(lab,i){
    const hx = padL + i*(barW+gap);
    const rows = series.filter(function(ser){return (ser.data[i]||0)&gt;0;}).map(function(ser){ return [ser.label||&#x27;&#x27;, &#x27;$&#x27;+valueFmt(ser.data[i])+&#x27;M&#x27;]; });
    if (extraRows) extraRows(i).forEach(function(r){rows.push(r);});

/* Multi-line chart with optional dashed series and area fill */

    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));

  xLabels.forEach((lab,i)=&gt;{
    if (i % xTickEvery === 0 || (i === n-1 &amp;&amp; (n-1) % xTickEvery &gt; xTickEvery/3)){
      const x = padL + (i/(n-1))*plotW;
      const t = svgEl(&#x27;text&#x27;,{x,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,fill:BCG.muted});

      svg.appendChild(t);
    }
  });
  series.forEach(ser=&gt;{
    let d = &#x27;&#x27;;
    ser.data.forEach((v,i)=&gt;{
      if (v==null) return;
      const x = padL + (i/(n-1))*plotW;
      const y = padTop + plotH - (v/max)*plotH;
      d += (d===&#x27;&#x27;?&#x27;M&#x27;:&#x27;L&#x27;) + x + &#x27;,&#x27; + y + &#x27; &#x27;;

      const x0 = padL + (first/(n-1))*plotW, x1 = padL + (last/(n-1))*plotW;

    });
  })();
  return svg;
}

/* Simple vertical bar chart: one series, value labels, optional bracket annotation */
function bcgBarChart(container, opts){
  const {labels, values, color=BCG.pulse3, maxY, valueFmt=v=&gt;v, bracket} = opts;
  const w = container.clientWidth || 400, h = container.clientHeight || 210;
  const padTop = bracket ? 46 : 20, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const max = maxY || Math.max(...values) * 1.15;
  const n = values.length;
  const gap = 10;
  const barW = (w - padL - padR - gap*(n-1)) / n;
  // gridlines
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  values.forEach((v,i)=&gt;{
    const bh = (v/max)*plotH;
    const x = padL + i*(barW+gap);
    const y = padTop + plotH - bh;
    svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:bh,fill:color,rx:2}));
    const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:BCG.ink});
    t.textContent = valueFmt(v);
    svg.appendChild(t);
    const lbl = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,fill:BCG.muted});
    lbl.textContent = labels[i];
    svg.appendChild(lbl);
  });
  if (bracket){
    const ia = Math.max(0,n-2), ib = n-1;
    const x0 = padL + ia*(barW+gap) + barW/2, x1 = padL + ib*(barW+gap) + barW/2;
    const topVals = [values[ia], values[ib]];
    const yTop = padTop + plotH - (Math.max(...topVals)/max)*plotH - 28;
    const y0 = padTop + plotH - (values[ia]/max)*plotH - 20;
    const y1 = padTop + plotH - (values[n-1]/max)*plotH - 20;
    svg.appendChild(svgEl(&#x27;path&#x27;,{d:`M${x0},${y0} L${x0},${yTop} L${x1},${yTop} L${x1},${y1}`,fill:&#x27;none&#x27;,stroke:BCG.muted,&#x27;stroke-width&#x27;:1.2}));
    const lbl = svgEl(&#x27;text&#x27;,{x:(x0+x1)/2,y:yTop-4,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:(String(bracket).trim().charAt(0)===&#x27;-&#x27;?BCG.tangerine4:BCG.pulse4)});
    lbl.textContent = bracket;
    svg.appendChild(lbl);
  }
  
  values.forEach(function(v,i){
    const hx = padL + i*(barW+gap);
    __attach(__hit(svg, hx, padTop, barW, plotH),
      &#x27;&lt;div style=&quot;font-weight:700&quot;&gt;&#x27;+labels[i]+&#x27;&lt;/div&gt;&lt;div style=&quot;font-size:14px;font-weight:800;margin-top:1px&quot;&gt;$&#x27;+valueFmt(v)+&#x27;M&lt;/div&gt;&#x27;);
  });
  return svg;
}
/* Grouped bar chart: 2+ series side by side per category, with optional per-pair YoY% labels */
function bcgGroupedBarChart(container, opts){
  const {labels, series, maxY, valueFmt=v=&gt;v, yoy} = opts;
  const w = container.clientWidth || 500, h = container.clientHeight || 210;
  const padTop = 28, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const allVals = series.flatMap(s=&gt;s.data);
  const max = maxY || Math.max(...allVals) * 1.2;
  const n = labels.length, s = series.length;
  const groupGap = 14, barGap = 3;
  const groupW = (w - padL - padR - groupGap*(n-1)) / n;
  const barW = (groupW - barGap*(s-1)) / s;
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  labels.forEach((lab,i)=&gt;{
    const gx = padL + i*(groupW+groupGap);
    series.forEach((ser,j)=&gt;{
      const v = ser.data[i];
      const bh = (v/max)*plotH;
      const x = gx + j*(barW+barGap);
      const y = padTop + plotH - bh;
      svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:Math.max(bh,0.5),fill:ser.color,rx:1.5}));
      if (bh &gt; 12){
        const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y+bh/2+3,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:8,&#x27;font-weight&#x27;:600,fill:&#x27;#FCFBFA&#x27;});
        t.textContent = valueFmt(v);
        svg.appendChild(t);
      }
    });
    const lbl = svgEl(&#x27;text&#x27;,{x:gx+groupW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,fill:BCG.muted});
    lbl.textContent = lab;
    svg.appendChild(lbl);
    if (yoy &amp;&amp; yoy[i] !== undefined){
      const topV = Math.max(...series.map(ser=&gt;ser.data[i]));
      const y = padTop + plotH - (topV/max)*plotH - 5;
      const g = yoy[i];
      const t = svgEl(&#x27;text&#x27;,{x:gx+groupW/2,y,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,&#x27;font-weight&#x27;:700,fill:(g&gt;=0?BCG.pulse4:BCG.tangerine4)});
      t.textContent = (g&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+g+&#x27;%&#x27;;
      svg.appendChild(t);
    }
  });
  
  labels.forEach(function(lab,i){
    const hgx = padL + i*(groupW+groupGap);
    const rows = series.map(function(ser){ return [ser.label||&#x27;&#x27;, &#x27;$&#x27;+valueFmt(ser.data[i])+&#x27;M&#x27;]; });
    if (yoy &amp;&amp; yoy[i]!==undefined) rows.push([&#x27;YoY&#x27;, (yoy[i]&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+yoy[i]+&#x27;%&#x27;]);
    __attach(__hit(svg, hgx, padTop, groupW, plotH), __ttRows(lab, rows));
  });
  return svg;
}
/* Stacked bar chart: multiple series stacked per category, totals + optional YoY bracket on last two bars */
function bcgStackedBarChart(container, opts){
  const {labels, series, maxY, valueFmt=v=&gt;Math.round(v), totalsOverride, extraRows} = opts;
  const w = container.clientWidth || 500, h = container.clientHeight || 260;
  const padTop = 40, padBottom = 22, padL = 8, padR = 8;
  const svg = makeSvg(container, w, h);
  const plotH = h - padTop - padBottom;
  const totals = totalsOverride ? totalsOverride.slice() : labels.map((_,i)=&gt;series.reduce((s,ser)=&gt;s+(ser.data[i]||0),0));
  const stackTops = labels.map((_,i)=&gt;series.reduce((s,ser)=&gt;s+Math.max(ser.data[i]||0,0),0));
  const max = maxY || Math.max(...stackTops) * 1.2;
  const n = labels.length;
  const gap = 16;
  const barW = (w - padL - padR - gap*(n-1)) / n;
  [0,0.5,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
  });
  labels.forEach((lab,i)=&gt;{
    const x = padL + i*(barW+gap);
    let yCursor = padTop + plotH;
    series.forEach(ser=&gt;{
      const v = ser.data[i] || 0;
      if (v &lt;= 0) return;
      const bh = (v/max)*plotH;
      const y = yCursor - bh;
      svg.appendChild(svgEl(&#x27;rect&#x27;,{x,y,width:barW,height:bh,fill:ser.color}));
      if (bh &gt; 11){
        const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:y+bh/2+3,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:8,&#x27;font-weight&#x27;:600,fill:&#x27;#FCFBFA&#x27;});
        t.textContent = valueFmt(v);
        svg.appendChild(t);
      }
      yCursor = y;
    });
    const t = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:yCursor-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,&#x27;font-weight&#x27;:700,fill:BCG.ink});
    t.textContent = valueFmt(totals[i]);
    svg.appendChild(t);
    const lbl = svgEl(&#x27;text&#x27;,{x:x+barW/2,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:10,fill:BCG.muted});
    lbl.textContent = lab;
    svg.appendChild(lbl);
  });
  if (n &gt;= 2 &amp;&amp; !opts.noBracket){
    const totPrev = totals[n-2], totCurr = totals[n-1];
    const yoy = totPrev ? Math.round((totCurr-totPrev)/totPrev*100) : 0;
    const xPrev = padL + (n-2)*(barW+gap) + barW/2;
    const xCurr = padL + (n-1)*(barW+gap) + barW/2;
    const yPrev = padTop + plotH - (stackTops[n-2]/max)*plotH - 16;
    const yCurr = padTop + plotH - (stackTops[n-1]/max)*plotH;
    const yMid = yPrev - 12;
    const color = yoy&gt;=0 ? BCG.pulse4 : BCG.tangerine4;
    svg.appendChild(svgEl(&#x27;path&#x27;,{d:`M${xPrev},${yPrev} L${xPrev},${yMid} L${xCurr},${yMid} L${xCurr},${yCurr-6}`,fill:&#x27;none&#x27;,stroke:color,&#x27;stroke-width&#x27;:1.3}));
    const t = svgEl(&#x27;text&#x27;,{x:(xPrev+xCurr)/2,y:yMid-4,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:11,&#x27;font-weight&#x27;:700,fill:color});
    t.textContent = (yoy&gt;0?&#x27;+&#x27;:&#x27;&#x27;)+yoy+&#x27;%&#x27;;
    svg.appendChild(t);
  }
  
  labels.forEach(function(lab,i){
    const hx = padL + i*(barW+gap);
    const rows = series.filter(function(ser){return (ser.data[i]||0)&gt;0;}).map(function(ser){ return [ser.label||&#x27;&#x27;, &#x27;$&#x27;+valueFmt(ser.data[i])+&#x27;M&#x27;]; });
    if (extraRows) extraRows(i).forEach(function(r){rows.push(r);});
    rows.push([&#x27;Total&#x27;, &#x27;$&#x27;+valueFmt(totals[i])+&#x27;M&#x27;]);
    __attach(__hit(svg, hx, padTop, barW, plotH), __ttRows(lab, rows));
  });
  return svg;
}
/* Multi-line chart with optional dashed series and area fill */
function bcgLineChart(container, opts){
  const {xLabels, series, maxY, yFmt=v=&gt;v, xTickEvery=10, axisFmt} = opts;
  const w = container.clientWidth || 500, h = container.clientHeight || 230;
  const padTop = 14, padBottom = 22, padL = 40, padR = 14;
  const svg = makeSvg(container, w, h);
  const plotW = w - padL - padR, plotH = h - padTop - padBottom;
  const allVals = series.flatMap(s=&gt;s.data.filter(v=&gt;v!=null));
  const max = maxY || Math.max(...allVals) * 1.15;
  const n = xLabels.length;
  [0,0.25,0.5,0.75,1].forEach(f=&gt;{
    const y = padTop + plotH*(1-f);
    svg.appendChild(svgEl(&#x27;line&#x27;,{x1:padL,y1:y,x2:w-padR,y2:y,stroke:BCG.line,&#x27;stroke-width&#x27;:1}));
    const t = svgEl(&#x27;text&#x27;,{x:padL-6,y:y+3,&#x27;text-anchor&#x27;:&#x27;end&#x27;,&#x27;font-size&#x27;:9,fill:BCG.muted});
    t.textContent = (axisFmt||yFmt)(Math.round(max*f));
    svg.appendChild(t);
  });
  xLabels.forEach((lab,i)=&gt;{
    if (i % xTickEvery === 0 || (i === n-1 &amp;&amp; (n-1) % xTickEvery &gt; xTickEvery/3)){
      const x = padL + (i/(n-1))*plotW;
      const t = svgEl(&#x27;text&#x27;,{x,y:h-6,&#x27;text-anchor&#x27;:&#x27;middle&#x27;,&#x27;font-size&#x27;:9,fill:BCG.muted});
      t.textContent = lab;
      svg.appendChild(t);
    }
  });
  series.forEach(ser=&gt;{
    let d = &#x27;&#x27;;
    ser.data.forEach((v,i)=&gt;{
      if (v==null) return;
      const x = padL + (i/(n-1))*plotW;
      const y = padTop + plotH - (v/max)*plotH;
      d += (d===&#x27;&#x27;?&#x27;M&#x27;:&#x27;L&#x27;) + x + &#x27;,&#x27; + y + &#x27; &#x27;;
    });
    if (ser.fill){
      let last = null, first=null;
      ser.data.forEach((v,i)=&gt;{ if(v!=null){ if(first===null) first=i; last=i; }});
      const x0 = padL + (first/(n-1))*plotW, x1 = padL + (last/(n-1))*plotW;
      const areaD = d + `L${x1},${padTop+plotH} L${x0},${padTop+plotH} Z`;
      svg.appendChild(svgEl(&#x27;path&#x27;,{d:areaD, fill:ser.color, opacity:0.10}));
    }
    svg.appendChild(svgEl(&#x27;path&#x27;,{d, fill:&#x27;none&#x27;, stroke:ser.color, &#x27;stroke-width&#x27;:ser.width||2, &#x27;stroke-dasharray&#x27;: ser.dashed?&#x27;5,4&#x27;:&#x27;none&#x27;}));
  });
  
  (function(){
    const step = n&gt;1 ? plotW/(n-1) : plotW;
    xLabels.forEach(function(lab,i){
      const rows = series.filter(function(ser){return ser.data[i]!=null;}).map(function(ser){ return [ser.label||&#x27;&#x27;, yFmt(ser.data[i])]; });
      if(!rows.length) return;
      const cx = padL + (n&gt;1?(i/(n-1)):0)*plotW;
      const title = /^\s*\d+\s*$/.test(String(lab)) ? (&#x27;Week &#x27;+lab) : String(lab);
      __attach(__hit(svg, Math.max(padL, cx-step/2), padTop, step, plotH), __ttRows(title, rows));
    });
  })();
  return svg;
}

function mny(v){ return &#x27;$&#x27;+v.toFixed(1)+&#x27;M&#x27;; }
function shortMdp(m){ if(!m) return &#x27;&#x27;; const p=String(m).split(&#x27; &#x27;); return p.length&gt;1 ? p[0]+&#x27; &#x27;+p[1][0]+&#x27;.&#x27; : m; }

// Generic click-to-sort helper: rebuilds the table&#x27;s header row with sort
// controls and re-renders the tbody whenever a sortable column is clicked.
function makeSortable(tbodyId, data, cols, rowHtml, defCol, defDir, emptyHtml){
  const body=document.getElementById(tbodyId);
  const headTr=body.closest(&#x27;table&#x27;).querySelector(&#x27;thead tr&#x27;);
  const state={col:defCol, dir:defDir};
  function cmp(c){
    return (a,b)=&gt;{
      let x=c.get(a), y=c.get(b);
      if(c.type===&#x27;num&#x27;){ x=(x==null||isNaN(x))?-Infinity:x; y=(y==null||isNaN(y))?-Infinity:y; return (x-y)*state.dir; }
      x=(x==null?&#x27;&#x27;:x).toString().toLowerCase(); y=(y==null?&#x27;&#x27;:y).toString().toLowerCase();
      return (x&lt;y?-1:x&gt;y?1:0)*state.dir;
    };
  }
  function renderHead(){
    headTr.innerHTML = cols.map((c,i)=&gt;{
      const sortable=c.sortable!==false;
      const active=sortable &amp;&amp; i===state.col;
      const arrow = !sortable ? &#x27;&#x27; : active ? (state.dir&gt;0?&#x27;▲&#x27;:&#x27;▼&#x27;) : &#x27;⇅&#x27;;
      const cls=[c.align===&#x27;r&#x27;?&#x27;r&#x27;:&#x27;&#x27;, sortable?&#x27;sortable&#x27;:&#x27;&#x27;, active?&#x27;sorted&#x27;:&#x27;&#x27;].filter(Boolean).join(&#x27; &#x27;);
      return `&lt;th class=&quot;${cls}&quot; data-i=&quot;${i}&quot;&gt;${c.label}${sortable?`&lt;span class=&quot;sort-arrow&quot;&gt;${arrow}&lt;/span&gt;`:&#x27;&#x27;}&lt;/th&gt;`;
    }).join(&#x27;&#x27;);
    headTr.querySelectorAll(&#x27;th&#x27;).forEach(th=&gt;{
      const i=+th.dataset.i;
      if(cols[i].sortable===false) return;
      th.addEventListener(&#x27;click&#x27;,()=&gt;{
        if(state.col===i) state.dir=-state.dir;
        else { state.col=i; state.dir = cols[i].type===&#x27;num&#x27;?-1:1; }
        render();
      });
    });
  }
  function render(){
    renderHead();
    if(emptyHtml &amp;&amp; (!data || data.length===0)){ body.innerHTML=emptyHtml; return; }
    const rows=data.slice().sort(cmp(cols[state.col]));
    body.innerHTML = rows.map((r,i)=&gt;rowHtml(r,i)).join(&#x27;&#x27;);
  }
  render();
}

// Active Pipeline — filterable (segment + probability) + sortable
const PIPE_COLS = [
  {label:&#x27;Client&#x27;,  get:a=&gt;a.client, type:&#x27;text&#x27;},
  {label:&#x27;Project&#x27;, get:a=&gt;a.proj,   type:&#x27;text&#x27;},

  {label:&#x27;Prob.&#x27;,   get:a=&gt;a.prob,   type:&#x27;num&#x27;, align:&#x27;r&#x27;},
  {label:&#x27;Value $M&#x27;,get:a=&gt;a.val,    type:&#x27;num&#x27;, align:&#x27;r&#x27;},
  {label:&#x27;Wt $M&#x27;,   get:a=&gt;a.wt,     type:&#x27;num&#x27;, align:&#x27;r&#x27;}
];
const PIPE_ROW = a=&gt;`&lt;tr&gt;
  &lt;td class=&quot;cl&quot;&gt;${a.client}&lt;/td&gt;&lt;td class=&quot;pr&quot;&gt;${a.proj||&#x27;&#x27;}&lt;/td&gt;&lt;td&gt;${segPill(a.seg)}&lt;/td&gt;
  &lt;td class=&quot;mdp&quot;&gt;${shortMdp(a.mdp)}&lt;/td&gt;
  &lt;td class=&quot;r&quot;&gt;&lt;span class=&quot;prob-bar&quot;&gt;&lt;span class=&quot;prob-fill&quot; style=&quot;width:${Math.round(a.prob*100)}%&quot;&gt;&lt;/span&gt;&lt;/span&gt;${Math.round(a.prob*100)}%&lt;/td&gt;
  &lt;td class=&quot;val&quot;&gt;${a.val.toFixed(2)}&lt;/td&gt;&lt;td class=&quot;wt&quot;&gt;${a.wt.toFixed(2)}&lt;/td&gt;&lt;/tr&gt;`;
const PIPE_EMPTY = &#x27;&lt;tr&gt;&lt;td colspan=&quot;7&quot; style=&quot;text-align:center;padding:20px;color:#8A9691;&quot;&gt;No opportunities match these filters.&lt;/td&gt;&lt;/tr&gt;&#x27;;

let pipeSeg=&#x27;all&#x27;, pipeProb=0;   // pipeProb: 0=all, 50=&gt;50%, 75=&gt;75% (inclusive of the boundary)
function segShort(s){ if(s===&#x27;MDBs, DFIs and Multilaterals&#x27;)return &#x27;MDBs &amp; DFIs&#x27;; if(s===&#x27;Philanthropy &amp; NGOs&#x27;)return &#x27;Philanthropy&#x27;; if(s===&#x27;Private Sector&#x27;)return &#x27;Private&#x27;; return s||&#x27;—&#x27;; }
function pipeFiltered(){
  return DATA.active.filter(a=&gt;{
    if(pipeProb&gt;0 &amp;&amp; (a.prob*100) &lt; pipeProb - 1e-9) return false;
    if(pipeSeg!==&#x27;all&#x27; &amp;&amp; a.seg!==pipeSeg) return false;
    return true;
  });
}
function renderPipe(){
  const f=pipeFiltered();
  const tot=f.reduce((s,a)=&gt;s+a.val,0);
  const wt =f.reduce((s,a)=&gt;s+a.wt,0);
  const prob = tot&gt;0 ? Math.round(wt/tot*100) : 0;
  document.getElementById(&#x27;k-opps&#x27;).textContent = f.length;
  document.getElementById(&#x27;k-tot&#x27;).textContent  = mny(tot);
  document.getElementById(&#x27;k-wt&#x27;).textContent   = mny(wt);
  document.getElementById(&#x27;k-prob&#x27;).textContent = prob+&#x27;%&#x27;;
  const bits=[];
  if(pipeSeg!==&#x27;all&#x27;) bits.push(segShort(pipeSeg));
  if(pipeProb&gt;0) bits.push(&#x27;&amp;gt; &#x27;+pipeProb+&#x27;% prob&#x27;);
  const suffix = bits.length ? &#x27; · &#x27;+bits.join(&#x27; · &#x27;) : &#x27;&#x27;;
  document.getElementById(&#x27;pipe-count&#x27;).innerHTML = &#x27;— &#x27;+f.length+&#x27; of &#x27;+DATA.active.length+&#x27; opportunities&#x27;+suffix+&#x27; · click a column to sort&#x27;;
  makeSortable(&#x27;pipe-body&#x27;, f, PIPE_COLS, PIPE_ROW, 5, -1, PIPE_EMPTY);
}

(function(){

// Wins &amp; Losses KPIs
const d26=DATA.winTot26, d25=DATA.winTot25, delta=+(d26-d25).toFixed(1), dpct=Math.round((d26-d25)/d25*100);

&lt;script&gt;
const SEG=[{&quot;name&quot;: &quot;Governments&quot;, &quot;ncc&quot;: 150.914, &quot;bl&quot;: 22.607, &quot;pipe&quot;: 7.725, &quot;est&quot;: 181.246}, {&quot;name&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;ncc&quot;: 56.822, &quot;bl&quot;: 12.287, &quot;pipe&quot;: 3.233, &quot;est&quot;: 72.342}, {&quot;name&quot;: &quot;Private&quot;, &quot;ncc&quot;: 12.982, &quot;bl&quot;: 0.736, &quot;pipe&quot;: 1.392, &quot;est&quot;: 15.11}, {&quot;name&quot;: &quot;MDBs, DFIs and Multilaterals&quot;, &quot;ncc&quot;: 3.541, &quot;bl&quot;: 1.009, &quot;pipe&quot;: 1.709, &quot;est&quot;: 6.259}, {&quot;name&quot;: &quot;Aid Agencies&quot;, &quot;ncc&quot;: 0.034, &quot;bl&quot;: 0.243, &quot;pipe&quot;: 0, &quot;est&quot;: 0.277}], OPP=[{&quot;client&quot;: &quot;Northern Illinois Transit Authority (NITA)&quot;, &quot;proj&quot;: &quot;NITA Period 2&quot;, &quot;seg&quot;: &quot;Governments&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 3.823, &quot;wt&quot;: 3.441}, {&quot;client&quot;: &quot;New Jersey Institute of Technology&quot;, &quot;proj&quot;: &quot;Enterprise Plan&quot;, &quot;seg&quot;: &quot;Governments&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 2.41, &quot;wt&quot;: 1.808}, {&quot;client&quot;: &quot;United Nations Children&#x27;s Fund (UNICEF)&quot;, &quot;proj&quot;: &quot;Vaccine AI Reshape&quot;, &quot;seg&quot;: &quot;MDBs, DFIs and Multilaterals&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 2.279, &quot;wt&quot;: 1.709}, {&quot;client&quot;: &quot;State of California&quot;, &quot;proj&quot;: &quot;EDD AI Roadmap&quot;, &quot;seg&quot;: &quot;Governments&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 1.9, &quot;wt&quot;: 1.425}, {&quot;client&quot;: &quot;Google Inc.&quot;, &quot;proj&quot;: &quot;GenAI Fund: CNA&quot;, &quot;seg&quot;: &quot;Private&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 1.047, &quot;wt&quot;: 0.942}, {&quot;client&quot;: &quot;Lincoln Center for the Performing Arts Inc&quot;, &quot;proj&quot;: &quot;LCPA Loyalty Program&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 1, &quot;wt&quot;: 0.9}, {&quot;client&quot;: &quot;State of California&quot;, &quot;proj&quot;: &quot;Hospital Value Strategy&quot;, &quot;seg&quot;: &quot;Governments&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 0.731, &quot;wt&quot;: 0.658}, {&quot;client&quot;: &quot;R CO Division&quot;, &quot;proj&quot;: &quot;ARO Partner Ecosystem - S&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 0.656, &quot;wt&quot;: 0.591}, {&quot;client&quot;: &quot;South Bay Community Services&quot;, &quot;proj&quot;: &quot;Community grant planning&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 0.611, &quot;wt&quot;: 0.55}, {&quot;client&quot;: &quot;Global Health Division (GH) (Gates Foundation)&quot;, &quot;proj&quot;: &quot;AMMPS Strategic plan&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 0.716, &quot;wt&quot;: 0.537}, {&quot;client&quot;: &quot;Biotech CEO Sisterhood&quot;, &quot;proj&quot;: &quot;Women Pharma CEO Trends&quot;, &quot;seg&quot;: &quot;Private&quot;, &quot;prob&quot;: 90, &quot;tot&quot;: 0.5, &quot;wt&quot;: 0.45}, {&quot;client&quot;: &quot;Detroit Employment Solutions Corporation&quot;, &quot;proj&quot;: &quot;Detroit workforce&quot;, &quot;seg&quot;: &quot;Governments&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 0.525, &quot;wt&quot;: 0.394}, {&quot;client&quot;: &quot;The Meadows Mental Health Policy Institute for Texas&quot;, &quot;proj&quot;: &quot;Confidential&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 0.45, &quot;wt&quot;: 0.338}, {&quot;client&quot;: &quot;United Nations Foundation&quot;, &quot;proj&quot;: &quot;Africa AI &amp; Compute Study&quot;, &quot;seg&quot;: &quot;Philanthropy &amp; NGOs&quot;, &quot;prob&quot;: 75, &quot;tot&quot;: 0.424, &quot;wt&quot;: 0.318}], T={&quot;ncc&quot;: 224.29299999999998, &quot;bl&quot;: 36.882, &quot;pipe&quot;: 14.059, &quot;sold&quot;: 261.17499999999995, &quot;est&quot;: 275.234}, FY25=272.515396689821;
const f1=v=&gt;(Math.round(v*10)/10).toFixed(1), fmt=v=&gt;&#x27;$&#x27;+f1(v)+&#x27;M&#x27;;
const shortSeg=n=&gt;n.replace(&#x27;MDBs, DFIs and Multilaterals&#x27;,&#x27;MDBs &amp; DFIs&#x27;).replace(&#x27;Philanthropy &amp; NGOs&#x27;,&#x27;Philanthropy&#x27;);
const BARS=[{label:&#x27;NCCs Realized&#x27;,key:&#x27;ncc&#x27;,base:0,val:T.ncc,fill:&#x27;#099341&#x27;,float:false},
 {label:&#x27;+ Sold Backlog&#x27;,key:&#x27;bl&#x27;,base:T.ncc,val:T.bl,fill:&#x27;#21BF61&#x27;,float:true},
 {label:&#x27;Total Sold&#x27;,key:&#x27;sold&#x27;,base:0,val:T.sold,fill:&#x27;#054C22&#x27;,float:false},
 {label:&#x27;+ Pipeline (≥75%)&#x27;,key:&#x27;pipe&#x27;,base:T.sold,val:T.pipe,fill:&#x27;rgba(69,74,193,0.18)&#x27;,stroke:&#x27;#8D95CE&#x27;,float:true},
 {label:&#x27;Est. Total&#x27;,key:&#x27;est&#x27;,base:0,val:T.est,fill:&#x27;rgba(69,74,193,0.22)&#x27;,stroke:&#x27;#8D95CE&#x27;,float:false}];
function drawWF(){
  const W=1000,H=330,pl=60,pr=40,pt=46,pb=34, ph=H-pt-pb, max=Math.ceil(T.est*1.08/40)*40;
  const y=v=&gt;pt+ph-(v/max)*ph, slot=(W-pl-pr)/BARS.length, bw=slot*0.62;
  let s=`&lt;svg viewBox=&quot;0 0 ${W} ${H}&quot; style=&quot;width:100%;height:auto&quot; font-family=&quot;Henderson BCG Sans, Arial, sans-serif&quot;&gt;`;
  for(let k=0;k&lt;=4;k++){ const v=max*k/4; s+=`&lt;line x1=&quot;${pl}&quot; x2=&quot;${W-pr}&quot; y1=&quot;${y(v)}&quot; y2=&quot;${y(v)}&quot; stroke=&quot;#DFD7CD&quot;/&gt;&lt;text x=&quot;${pl-8}&quot; y=&quot;${y(v)+3}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot; fill=&quot;#535353&quot;&gt;${Math.round(v)}&lt;/text&gt;`; }
  BARS.forEach((b,i)=&gt;{
    const x=pl+i*slot+(slot-bw)/2, top=y(b.base+b.val), hgt=y(b.base)-top;
    s+=`&lt;rect x=&quot;${x}&quot; y=&quot;${top}&quot; width=&quot;${bw}&quot; height=&quot;${hgt}&quot; fill=&quot;${b.fill}&quot; ${b.stroke?`stroke=&quot;${b.stroke}&quot; stroke-width=&quot;1.5&quot; stroke-dasharray=&quot;5 3&quot;`:&#x27;&#x27;} rx=&quot;2&quot;/&gt;`;
    s+=`&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${top-8}&quot; font-size=&quot;14&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot; fill=&quot;#0C2B15&quot;&gt;${b.float?&#x27;+&#x27;:&#x27;&#x27;}${f1(b.val)}&lt;/text&gt;`;
    s+=`&lt;text x=&quot;${x+bw/2}&quot; y=&quot;${H-pb+18}&quot; font-size=&quot;11&quot; text-anchor=&quot;middle&quot; fill=&quot;#0C2B15&quot;&gt;${b.label}&lt;/text&gt;`;
    if(i&lt;BARS.length-1){ const nx=pl+(i+1)*slot+(slot-bw)/2; s+=`&lt;line x1=&quot;${x+bw}&quot; x2=&quot;${nx}&quot; y1=&quot;${top}&quot; y2=&quot;${top}&quot; stroke=&quot;#7A7A7A&quot; stroke-dasharray=&quot;4 3&quot;/&gt;`; }
    s+=`&lt;rect class=&quot;wbar&quot; data-i=&quot;${i}&quot; x=&quot;${pl+i*slot}&quot; y=&quot;0&quot; width=&quot;${slot}&quot; height=&quot;${H-pb}&quot; fill=&quot;#000&quot; fill-opacity=&quot;0&quot; style=&quot;cursor:pointer&quot;/&gt;`;
  });
  const d=(T.est-FY25)/FY25*100, xl=pl+4*slot+slot/2;
  s+=`&lt;rect x=&quot;${xl-48}&quot; y=&quot;${y(T.est)-44}&quot; width=&quot;96&quot; height=&quot;19&quot; rx=&quot;9.5&quot; fill=&quot;rgba(232,171,0,0.16)&quot; stroke=&quot;rgba(232,171,0,0.5)&quot;/&gt;&lt;text x=&quot;${xl}&quot; y=&quot;${y(T.est)-31}&quot; font-size=&quot;11&quot; font-weight=&quot;700&quot; text-anchor=&quot;middle&quot; fill=&quot;#774A01&quot;&gt;${d&gt;=0?&#x27;+&#x27;:&#x27;&#x27;}${d.toFixed(0)}% vs 25 FY&lt;/text&gt;`;
  s+=&#x27;&lt;/svg&gt;&#x27;;
  document.getElementById(&#x27;wf&#x27;).innerHTML=s;
}
function drawTable(){
  let h=&#x27;&lt;tr&gt;&lt;th&gt;Business Line&lt;/th&gt;&lt;th&gt;NCCs YTD&lt;/th&gt;&lt;th&gt;Sold Backlog&lt;/th&gt;&lt;th&gt;Pipeline&lt;/th&gt;&lt;th&gt;Est. Total&lt;/th&gt;&lt;th class=&quot;barcell&quot; style=&quot;text-align:left&quot;&gt;Composition (% of total)&lt;/th&gt;&lt;/tr&gt;&#x27;;
  SEG.forEach((s,i)=&gt;{ const e=s.est||1, p=v=&gt;(v/e*100).toFixed(1);
    h+=`&lt;tr&gt;&lt;td class=&quot;seg&quot;&gt;${s.name}&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${f1(s.ncc)}&lt;/td&gt;&lt;td class=&quot;num bl&quot;&gt;${f1(s.bl)}&lt;/td&gt;&lt;td class=&quot;num pi&quot;&gt;${f1(s.pipe)}&lt;/td&gt;&lt;td class=&quot;num tot&quot;&gt;${f1(s.est)}&lt;/td&gt;
      &lt;td class=&quot;barcell&quot;&gt;&lt;div class=&quot;sbar&quot; data-seg=&quot;${i}&quot;&gt;&lt;div style=&quot;width:${p(Math.max(s.ncc,0))}%;background:#21BF61&quot;&gt;&lt;/div&gt;&lt;div style=&quot;width:${p(s.bl)}%;background:#85DDA8&quot;&gt;&lt;/div&gt;&lt;div style=&quot;width:${p(s.pipe)}%;background:repeating-linear-gradient(45deg,rgba(69,74,193,.5),rgba(69,74,193,.5) 4px,rgba(69,74,193,.2) 4px,rgba(69,74,193,.2) 8px)&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;/td&gt;&lt;/tr&gt;`; });
  h+=`&lt;tr class=&quot;total&quot;&gt;&lt;td class=&quot;seg&quot;&gt;Total&lt;/td&gt;&lt;td class=&quot;num&quot;&gt;${f1(T.ncc)}&lt;/td&gt;&lt;td class=&quot;num bl&quot;&gt;${f1(T.bl)}&lt;/td&gt;&lt;td class=&quot;num pi&quot;&gt;${f1(T.pipe)}&lt;/td&gt;&lt;td class=&quot;num tot&quot;&gt;${f1(T.est)}&lt;/td&gt;&lt;td class=&quot;barcell&quot;&gt;&lt;/td&gt;&lt;/tr&gt;`;
  document.getElementById(&#x27;segTable&#x27;).innerHTML=h;
}
drawWF(); drawTable();
const tt=document.getElementById(&#x27;tt&#x27;);
function mv(ev){ const p=14; let x=ev.clientX+p,y=ev.clientY+p; if(x+tt.offsetWidth&gt;innerWidth)x=ev.clientX-tt.offsetWidth-p; if(y+tt.offsetHeight&gt;innerHeight)y=ev.clientY-tt.offsetHeight-p; tt.style.left=Math.max(4,x)+&#x27;px&#x27;; tt.style.top=Math.max(4,y)+&#x27;px&#x27;; }
const mvs=(s,k)=&gt;k===&#x27;sold&#x27;?s.ncc+s.bl:s[k];
document.querySelectorAll(&#x27;.wbar&#x27;).forEach(el=&gt;{
  el.addEventListener(&#x27;mouseenter&#x27;,ev=&gt;{ const b=BARS[+el.dataset.i]; let h;
    if(b.key===&#x27;pipe&#x27;){
      h=`&lt;div class=&quot;tt-h&quot;&gt;Pipeline ≥75% probability · ${fmt(T.pipe)}&lt;/div&gt;`;
      OPP.forEach(o=&gt;h+=`&lt;div class=&quot;tt-r&quot;&gt;&lt;span&gt;${o.client} — ${o.proj} &lt;span style=&quot;opacity:.6&quot;&gt;(${o.prob}%)&lt;/span&gt;&lt;/span&gt;&lt;span&gt;${fmt(o.wt)}&lt;/span&gt;&lt;/div&gt;`);
      h+=`&lt;div class=&quot;tt-r&quot; style=&quot;border-top:1px solid #F1EEEA;margin-top:4px;padding-top:4px&quot;&gt;&lt;span&gt;${OPP.length} opportunities, weighted&lt;/span&gt;&lt;span&gt;${fmt(T.pipe)}&lt;/span&gt;&lt;/div&gt;`;
    } else {
      h=`&lt;div class=&quot;tt-h&quot;&gt;${b.label.replace(&#x27;+ &#x27;,&#x27;&#x27;)} · ${fmt(b.val)}&lt;/div&gt;`;
      SEG.map(s=&gt;({n:s.name,v:mvs(s,b.key)})).filter(r=&gt;r.v&gt;0.049).sort((a,c)=&gt;c.v-a.v).forEach(r=&gt;h+=`&lt;div class=&quot;tt-r&quot;&gt;&lt;span&gt;${shortSeg(r.n)}&lt;/span&gt;&lt;span&gt;${fmt(r.v)}&lt;/span&gt;&lt;/div&gt;`);
    }
    tt.innerHTML=h; tt.style.display=&#x27;block&#x27;; mv(ev); });
  el.addEventListener(&#x27;mousemove&#x27;,mv); el.addEventListener(&#x27;mouseleave&#x27;,()=&gt;tt.style.display=&#x27;none&#x27;);
});
document.querySelectorAll(&#x27;.sbar&#x27;).forEach(el=&gt;{
  el.addEventListener(&#x27;mouseenter&#x27;,ev=&gt;{ const s=SEG[+el.dataset.seg], e=s.est||1;
    let h=`&lt;div class=&quot;tt-h&quot;&gt;${shortSeg(s.name)} · ${fmt(s.est)}&lt;/div&gt;`;
    [[&#x27;NCCs YTD&#x27;,s.ncc],[&#x27;Sold Backlog&#x27;,s.bl],[&#x27;Pipeline (≥75%)&#x27;,s.pipe]].forEach(c=&gt;h+=`&lt;div class=&quot;tt-r&quot;&gt;&lt;span&gt;${c[0]}&lt;/span&gt;&lt;span&gt;${fmt(c[1])} · ${Math.round(c[1]/e*100)}%&lt;/span&gt;&lt;/div&gt;`);
    if(s.pipe&gt;0){ h+=&#x27;&lt;div style=&quot;margin-top:5px;font-size:10px;opacity:.75&quot;&gt;Pipeline opportunities:&lt;/div&gt;&#x27;; OPP.filter(o=&gt;o.seg===s.name).forEach(o=&gt;h+=`&lt;div class=&quot;tt-r&quot; style=&quot;font-size:11px&quot;&gt;&lt;span&gt;${o.client} (${o.prob}%)&lt;/span&gt;&lt;span&gt;${fmt(o.wt)}&lt;/span&gt;&lt;/div&gt;`); }
    tt.innerHTML=h; tt.style.display=&#x27;block&#x27;; mv(ev); });
  el.addEventListener(&#x27;mousemove&#x27;,mv); el.addEventListener(&#x27;mouseleave&#x27;,()=&gt;tt.style.display=&#x27;none&#x27;);
});
